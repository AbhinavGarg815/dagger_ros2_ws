<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dagger follow</title>
<style>
  /* No flex `gap`, `inset` or `aspect-ratio`: the SIYI MK32's browser predates them
     (2026-10-02: the status items ran together). Spacing is done with margins. */
  :root { --bg:#0e0e0e; --panel:#181818; --fg:#eee; --muted:#9a9a9a;
          --ok:#2e7d32; --go:#00c853; --warn:#ffab00; --bad:#d50000; --grey:#455a64; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
               font:14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #main { flex:1; min-height:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; min-height:0; min-width:0; display:flex; align-items:center;
           justify-content:center; background:#000; }
  canvas { display:block; max-width:100%; max-height:100%; cursor:crosshair; touch-action:none; }

  /* overlays on the video */
  #hud { position:absolute; left:0; right:0; top:0; display:flex; flex-wrap:wrap; align-items:center;
         padding:4px 8px; background:linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); pointer-events:none; }
  #hud > span { margin-right:14px; white-space:nowrap; }
  #hud .k { color:var(--muted); }
  #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad);
         margin-right:6px; vertical-align:middle; }
  #banner { position:absolute; top:34px; left:50%; transform:translateX(-50%); padding:6px 14px;
            border-radius:6px; font-weight:700; display:none; text-align:center; max-width:90%; }
  #msg { position:absolute; left:8px; bottom:8px; max-width:75%; color:var(--warn);
         background:rgba(0,0,0,.72); border-radius:6px; padding:4px 8px; }
  #msg:empty { display:none; }

  /* the controls panel */
  #panel { display:flex; align-items:stretch; background:var(--panel); padding:6px; }
  #state { display:flex; flex-direction:column; justify-content:center; padding:6px 12px; margin:0 6px 0 0;
           border-radius:8px; background:var(--grey); font-weight:700; min-width:150px; }
  #state small { font-weight:400; opacity:.85; }
  button { font:inherit; font-weight:700; border:0; border-radius:8px; padding:14px 18px; margin:0 6px 0 0;
           color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:active { filter:brightness(1.3); }
  button:disabled { opacity:.3; cursor:not-allowed; filter:none; }
  #stop { background:var(--bad); flex:1; font-size:22px; letter-spacing:1px; }
  #follow { background:var(--ok); } #clear { background:#616161; }
  #lite, #full { background:#37474f; } #lite.on { background:#0277bd; }
  #small { display:flex; }
  .key { opacity:.7; font-weight:400; }

  /* HANDSET (touch screen, e.g. the SIYI MK32): video at full height on the left,
     a column of big controls on the right, no zoom / scroll / text selection. */
  body.handset { font-size:15px; -webkit-user-select:none; user-select:none; touch-action:none; }
  body.handset #main { flex-direction:row; }
  body.handset #panel { flex-direction:column; width:24%; min-width:150px; max-width:260px; padding:8px; }
  body.handset #state { margin:0 0 8px 0; min-width:0; min-height:64px; font-size:19px; text-align:center; }
  body.handset button { margin:0 0 8px 0; padding:6px; font-size:21px; }
  body.handset #stop { flex:2.4; font-size:30px; }
  body.handset #follow, body.handset #clear { flex:1.1; }
  body.handset #small { flex:0.8; margin:0; }
  body.handset #small button { flex:1; margin:0 4px 0 0; font-size:17px; }
  body.handset #small button:last-child { margin-right:0; }
  body.handset .key { display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="main">
    <div id="stage">
      <canvas id="cv" width="640" height="480"></canvas>
      <div id="hud">
        <span><span id="dot"></span><b id="conn">connecting…</b></span>
        <span><span class="k">age</span> <b id="age">–</b></span>
        <span><span class="k">fps</span> <b id="fps">–</b></span>
        <span><span class="k">rtt</span> <b id="rtt">–</b></span>
        <span><b id="npeople">–</b></span>
        <span><span class="k">target</span> <b id="target">none</b></span>
      </div>
      <div id="banner"></div>
      <div id="msg"></div>
    </div>
    <div id="panel">
      <div id="state">OFF<small>select a target</small></div>
      <button id="stop">STOP<span class="key"> (space)</span></button>
      <button id="follow" disabled>FOLLOW</button>
      <button id="clear">CLEAR<span class="key"> (esc)</span></button>
      <div id="small">
        <button id="lite" title="half-size video for a slow, long-range link">LITE</button>
        <button id="full" title="full screen">FULL</button>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
let ws = null, backoff = 500;
// VIDEO FIRST: a frame arrives before its boxes (a separate "boxes" message,
// ~50 ms later). `shown` = what is on screen: the frame and the boxes drawn on it;
// taps resolve against exactly that.
let shown = null;                 // {hdr, bmp, boxes}
const boxesBy = {};               // frame stamp -> its boxes message (the last few)
let latest = null;                // the newest boxes message: selection + state
let decoding = false, pending = null;
let offset = null, bestRtt = Infinity, rtts = [];
let drawn = 0, fpsT0 = performance.now();
let following = false, frameHdr = null;
let prevState = "", reidUntil = 0;

function setMsg(t) { $("msg").textContent = t || ""; }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// Handset layout on a touch screen (the SIYI MK32), or forced with ?handset=1 / ?handset=0.
// pointer:coarse alone was not enough: the MK32's browser does not report it.
const qs = new URLSearchParams(location.search);
const touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0)
              || !!(window.matchMedia && matchMedia("(any-pointer: coarse)").matches);
const handset = qs.has("handset") ? qs.get("handset") !== "0" : touch;
if (handset) document.body.classList.add("handset");
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let lite = qs.has("video") ? qs.get("video") === "lite" : store("video") === "lite";

// ---------- geometry: native camera pixels <-> upright canvas ----------
// Own 2D affine instead of DOMMatrix / DOMPoint, which older Android WebViews
// lack. x' = a x + c y + e, y' = b x + d y + f (canvas setTransform order).
function pt(x, y) { return { x: x, y: y }; }
function Aff(a, b, c, d, e, f) { this.a = a; this.b = b; this.c = c; this.d = d; this.e = e; this.f = f; }
Aff.prototype.apply = function (p) { return pt(this.a * p.x + this.c * p.y + this.e, this.b * p.x + this.d * p.y + this.f); };
Aff.prototype.inverse = function () {
  const k = this.a * this.d - this.b * this.c;
  return new Aff(this.d / k, -this.b / k, -this.c / k, this.a / k,
                 (this.c * this.f - this.d * this.e) / k, (this.b * this.e - this.a * this.f) / k);
};
function setT(m) { ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f); }
function viewMatrix(h) {
  const W = h.w || 640, H = h.h || 480, rot = ((h.rot || 0) % 360 + 360) % 360;
  const upW = (rot === 90 || rot === 270) ? H : W, upH = (rot === 90 || rot === 270) ? W : H;
  if (cv.width !== upW || cv.height !== upH) { cv.width = upW; cv.height = upH; }
  // rotate about the image centre, clockwise by rot (multiples of 90: exact), into the upright canvas
  const co = Math.round(Math.cos(rot * Math.PI / 180)), si = Math.round(Math.sin(rot * Math.PI / 180));
  return new Aff(co, si, -si, co, upW / 2 - (co * W / 2 - si * H / 2), upH / 2 - (si * W / 2 + co * H / 2));
}
function canvasPoint(ev) {
  const r = cv.getBoundingClientRect();
  return pt((ev.clientX - r.left) * cv.width / r.width, (ev.clientY - r.top) * cv.height / r.height);
}

// ---------- ArUco markers: track ids >= MARKER_BASE (marker_tracker id_base) ----------
const MARKER_BASE = 1000000;
const isMarker = id => id >= MARKER_BASE;
const tname = id => isMarker(id) ? "marker " + (id - MARKER_BASE) : "#" + id;
function quad(k) { const c = k.corners; return [0, 1, 2, 3].map(i => pt(c[2 * i], c[2 * i + 1])); }
function inQuad(p, q) {                    // convex: the point is on the same side of all 4 edges
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], cr = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
    if (cr !== 0) { if (sign !== 0 && Math.sign(cr) !== sign) return false; sign = Math.sign(cr); }
  }
  return true;
}
function quadArea(q) {
  let a = 0;
  for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
  return Math.abs(a) / 2;
}

// ---------- drawing ----------
function label(m, xs, ys, text, bg) {      // upright, above the shape as seen on screen
  const c = xs.map((x, i) => m.apply(pt(x, ys[i])));
  const lx = Math.min.apply(null, c.map(p => p.x)), ly = Math.min.apply(null, c.map(p => p.y));
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.setLineDash([]);
  ctx.font = "bold 18px sans-serif"; const tw = ctx.measureText(text).width;
  ctx.fillStyle = bg; ctx.fillRect(lx, Math.max(0, ly - 24), tw + 10, 24);
  ctx.fillStyle = "#fff"; ctx.fillText(text, lx + 5, Math.max(18, ly - 6));
}
function render() {
  if (!shown) return;
  const hdr = shown.hdr, b = shown.boxes, m = viewMatrix(hdr);
  // into NATIVE pixel size: a LITE frame is half that, the boxes are in native pixels
  setT(m); ctx.drawImage(shown.bmp, 0, 0, hdr.w || 640, hdr.h || 480);
  if (!b) { ctx.setTransform(1, 0, 0, 1, 0, 0); return; }
  for (const t of b.tracks || []) {
    const x1 = t.box[0], y1 = t.box[1], x2 = t.box[2], y2 = t.box[3], sel = t.id === b.selected;
    const ok = t.ranged !== false;           // LiDAR-ranged at least once = selectable
    setT(m);
    ctx.lineWidth = sel ? 5 : 2.5;
    ctx.strokeStyle = sel ? "#ff1744" : ok ? "#00e676" : "#9e9e9e";
    ctx.setLineDash(t.visible && ok ? [] : [8, 6]);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    label(m, [x1, x2, x1, x2], [y1, y1, y2, y2],
          "#" + t.id + (t.range != null ? "  " + t.range.toFixed(1) + " m" : ok ? "" : "  no LiDAR"),
          sel ? "#ff1744" : "rgba(0,0,0,.65)");
  }
  for (const k of b.markers || []) {
    const sel = k.id === b.selected;
    if (!k.visible && !sel) continue;       // an old outline would only mislead
    const q = quad(k);
    setT(m);
    ctx.lineWidth = sel ? 5 : 3;
    ctx.strokeStyle = sel ? "#ff1744" : k.ok ? "#00e5ff" : "#9e9e9e";
    ctx.setLineDash(k.visible && k.ok ? [] : [8, 6]);
    ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y);
    ctx.closePath(); ctx.stroke();
    label(m, q.map(p => p.x), q.map(p => p.y),
          "M" + k.mid + (k.range != null ? "  " + k.range.toFixed(1) + " m" : "  no range") + (k.ok ? "" : " ?"),
          sel ? "#ff1744" : "rgba(0,60,70,.8)");
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function banner(text, bg) {
  const b = $("banner");
  if (!text) { b.style.display = "none"; return; }
  b.style.display = "block"; b.style.background = bg; b.textContent = text;
}
function status() {
  const b = latest || { selected: -1, state: "NONE" }, h = frameHdr || {};
  const np = b.tracks ? b.tracks.length : null, nm = (b.markers || []).filter(k => k.visible).length;
  $("npeople").textContent = (np === null ? "no tracker" : np + " " + (np === 1 ? "person" : "people"))
                           + (b.markers ? " · " + nm + " marker" + (nm === 1 ? "" : "s") : "");
  const st = b.state || "NONE";
  let tgt = st === "NONE" ? "none" : tname(b.selected) + " " + st;
  if (h.range != null && st !== "NONE") tgt += " " + h.range.toFixed(1) + " m";
  $("target").textContent = tgt;
  // the big state indicator
  const fs = h.follow_state || (h.follow === true ? "enabled" : "off");
  following = fs === "following" || fs === "searching" || fs === "no target";
  let big = "OFF", small = st === "NONE" ? "select a target" : tname(b.selected) + " selected", bg = "var(--grey)";
  if (fs === "following") { big = "FOLLOWING"; small = tname(b.selected); bg = "var(--go)"; }
  else if (fs === "searching") { big = "SEARCHING"; small = tname(b.selected); bg = "var(--warn)"; }
  else if (fs === "no target") { big = "WAITING"; small = "no target"; bg = "var(--warn)"; }
  else if (fs.indexOf("disabled: target") === 0 || fs.indexOf("disabled: DEAD") === 0) { big = "STOPPED"; small = fs.slice(10); bg = "#b71c1c"; }
  else if (fs === "estop") { big = "E-STOP"; small = ""; bg = "#b71c1c"; }
  const s = $("state");
  s.style.background = bg;
  s.textContent = big;
  const sm = document.createElement("small"); sm.textContent = small; s.appendChild(sm);
  $("follow").disabled = !(h.allow_follow && b.selected >= 0 && st === "TRACKING" && !following);
  if (prevState === "SEARCHING" && st === "TRACKING") reidUntil = performance.now() + 2500;
  prevState = st;
  if (performance.now() < reidUntil)
    banner((isMarker(b.selected) ? "SEEN AGAIN: " : "RE-IDENTIFIED ") + tname(b.selected), "#2e7d32");
  else if (st === "SEARCHING")
    banner(tname(b.selected) + " lost — searching (resumes if " + (isMarker(b.selected) ? "seen again" : "re-identified") + " within 30 s)", "#ef6c00");
  else if (st === "LOST") banner("TARGET " + tname(b.selected) + " LOST — tap to reselect", "#c62828");
  else if (st === "HOLD_LIDAR") banner("#" + b.selected + " out of camera view — held on LiDAR", "#f9a825");
  else banner(null);
}
function meter(id, v, warn, bad, txt) {
  const e = $(id); e.textContent = txt; e.style.color = v > bad ? "#ff5252" : v > warn ? "#ffd740" : "#69f0ae";
}

// ---------- frames: decode newest only ----------
function onFrame(buf) {
  const dv = new DataView(buf), n = dv.getUint32(0);
  const hdr = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
  pending = { hdr: hdr, blob: new Blob([new Uint8Array(buf, 4 + n)], { type: "image/jpeg" }) };
  if (!decoding) decodeNext();
}
function decodeJpeg(blob) {                 // createImageBitmap where there is one, else an <img>
  if (window.createImageBitmap) return createImageBitmap(blob);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    im.src = url;
  });
}
async function decodeNext() {
  if (!pending) return;
  const p = pending; pending = null; decoding = true;
  try {
    const bmp = await decodeJpeg(p.blob);
    if (shown && shown.bmp && shown.bmp.close) shown.bmp.close();
    // its own boxes if they came first, else the previous frame's until they do
    shown = { hdr: p.hdr, bmp: bmp, boxes: boxesBy[p.hdr.stamp] || (shown ? shown.boxes : latest) };
    frameHdr = p.hdr;
    render(); status(); drawn++;
    $("lite").className = p.hdr.video === "lite" ? "on" : "";
    if (offset !== null) {
      const age = Date.now() / 1000 + offset - p.hdr.stamp;
      meter("age", age, 0.2, 0.35, Math.round(age * 1000) + " ms");
      $("dot").style.background = age > 0.35 ? "#ff5252" : age > 0.2 ? "#ffd740" : "#69f0ae";
    }
  } catch (e) { setMsg("decode error: " + e); }
  decoding = false;
  if (pending) decodeNext();
}
function onBoxes(b) {
  boxesBy[b.stamp] = b;
  const keys = Object.keys(boxesBy);
  if (keys.length > 8) keys.sort((x, y) => x - y).slice(0, keys.length - 8).forEach(k => delete boxesBy[k]);
  if (!latest || b.stamp >= latest.stamp) latest = b;
  if (shown && b.stamp === shown.hdr.stamp) { shown.boxes = b; render(); }
  status();
}

// ---------- input ----------
cv.addEventListener("click", ev => {
  const b = shown && shown.boxes;
  if (!b || !(b.tracks || b.markers)) return;
  const p = viewMatrix(shown.hdr).inverse().apply(canvasPoint(ev));   // -> native pixels
  let best = null;                          // the SMALLEST shape under the tap wins
  for (const k of b.markers || []) {
    if (!k.visible) continue;
    const q = quad(k);
    if (inQuad(p, q)) { const a = quadArea(q); if (!best || a < best.a) best = { id: k.id, a: a, ok: k.ok }; }
  }
  for (const t of b.tracks || []) {
    const x1 = t.box[0], y1 = t.box[1], x2 = t.box[2], y2 = t.box[3];
    if (p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2) {
      const a = (x2 - x1) * (y2 - y1);
      if (!best || a < best.a) best = { id: t.id, a: a, ok: t.ranged !== false };
    }
  }
  if (!best) {
    // a fingertip misses small (far) targets: take the nearest one within ~28 screen px
    const r = cv.getBoundingClientRect(), tol = 28 * cv.width / r.width;
    let near = null;
    const consider = (id, ok, x1, y1, x2, y2) => {
      const dx = Math.max(x1 - p.x, 0, p.x - x2), dy = Math.max(y1 - p.y, 0, p.y - y2), d = Math.hypot(dx, dy);
      if (d <= tol && (!near || d < near.d)) near = { id: id, ok: ok, d: d };
    };
    for (const k of b.markers || []) {
      if (!k.visible) continue;
      const xs = quad(k).map(q => q.x), ys = quad(k).map(q => q.y);
      consider(k.id, k.ok, Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys));
    }
    for (const t of b.tracks || []) consider(t.id, t.ranged !== false, t.box[0], t.box[1], t.box[2], t.box[3]);
    if (near) best = near;
  }
  if (best && !best.ok) {
    setMsg(isMarker(best.id)
      ? tname(best.id) + " is not selectable yet: not confirmed, or no range"
      : "#" + best.id + " is not selectable: the LiDAR has not ranged it");
    return;
  }
  if (best) {
    send({ type: "select", id: best.id });
    setMsg(following && best.id !== b.selected
      ? "selected " + tname(best.id) + " — following STOPS (different target); press FOLLOW to follow it"
      : "selected " + tname(best.id));
  }
  else setMsg("no person or marker there");
});
$("follow").onclick = () => send({ type: "follow" });
$("stop").onclick = () => { send({ type: "stop" }); setMsg("STOP sent"); };
$("clear").onclick = () => send({ type: "clear" });
$("lite").onclick = () => {
  lite = !lite; store("video", lite ? "lite" : "full");
  send({ type: "video", mode: lite ? "lite" : "full" });
  setMsg(lite ? "LITE video: half size, for a slow / long-range link" : "full video");
};
$("full").onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { setMsg("full screen not supported by this browser"); return; }
  const r = go.call(el);
  if (r && r.then) r.then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); })
                    .catch(e => setMsg("full screen refused: " + e));
};
document.addEventListener("keydown", ev => {
  if (ev.code === "Space") { ev.preventDefault(); $("stop").click(); }
  else if (ev.code === "Escape") $("clear").click();
});

// ---------- connection + clock ----------
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
                     + (lite ? "?video=lite" : ""));
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("conn").textContent = "link"; $("dot").style.background = "#69f0ae"; backoff = 500; setMsg(""); };
  ws.onclose = () => {
    $("conn").textContent = "NO LINK — retrying"; $("dot").style.background = "#ff5252";
    banner("NO LINK TO ROVER", "#c62828");
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 4000);
  };
  ws.onmessage = ev => {
    if (typeof ev.data !== "string") { onFrame(ev.data); return; }
    const m = JSON.parse(ev.data);
    if (m.type === "boxes") onBoxes(m);
    else if (m.type === "pong") {
      const now = Date.now() / 1000, rtt = now - m.t;
      rtts.push(rtt); if (rtts.length > 20) rtts.shift();
      if (rtt <= bestRtt * 1.5 || offset === null) {          // trust the fastest round trips
        bestRtt = Math.min(bestRtt, rtt); offset = m.server - (m.t + rtt / 2);
      }
      const avg = rtts.reduce((a, b) => a + b, 0) / rtts.length;
      meter("rtt", avg, 0.05, 0.15, Math.round(1000 * avg) + " ms");
    } else if (m.type === "error") setMsg(m.msg);
  };
}
setInterval(() => send({ type: "hb", t: Date.now() / 1000 }), 250);
setInterval(() => {
  const now = performance.now(), fps = drawn * 1000 / (now - fpsT0);
  meter("fps", 10 - fps, 2, 5, fps.toFixed(1)); drawn = 0; fpsT0 = now;
  if (shown && offset !== null && Date.now() / 1000 + offset - shown.hdr.stamp > 1.0) banner("STALE VIDEO", "#f9a825");
