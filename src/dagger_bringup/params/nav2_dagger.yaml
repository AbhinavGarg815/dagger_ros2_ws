        # publisher always runs; with ground_seg:=false it duplicates /scan.
        scan_band:
          topic: /scan_band
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          expected_update_rate: 1.0
          inf_is_valid: true
          raytrace_max_range: 30.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-09-17: 1.0 m / 3.0 painted walls ~1 m thick in a 3-4 m lane (user: "too much
        # obstacle area"). Steeper decay + 0.8 m keeps the hard no-go zone (inscribed
        # 0.58 m from the footprint) but frees the soft margin. Corner clearance is
        # still enforced by RPP's footprint collision check (use_collision_detection).
        cost_scaling_factor: 6.0
        inflation_radius: 0.8
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # Theta* (any-angle): in free space the path IS the straight line to the goal.
    # SmacPlanner2D was replaced 2026-09-14: its 8-connected grid turns a 39.4 deg
    # straight goal into 45 deg diagonals first (0.40 m bulge LEFT of the line);
    # replanned every 1 s from the new pose it always started 45 deg-first, so RPP
    # was pulled into a steady LEFT arc on a straight 6 m goal (bag
    # pf_legA_base_straight_2: carrot +5.6 deg left from t=0 with the rover on the line).
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0
      use_final_approach_orientation: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Heavy ~350kg tracked rover: moderate top speed to limit momentum overshoot,
    # low floor so it can ease into the target (but >stiction breakaway ~0.3),
    # gentle accel. In-place 180 turn-around test (2026-09-11).
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
