bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 -> 0.4 m (2026-09-16): pure pursuit steers as 1/distance^2, so chasing
      # the last 0.25 m turned a harmless 0.2-0.3 m lateral offset into a 57 deg
      # heading swing in the final metre (bag pf_lane_final), then ~3 s rotating
      # back. 0.4 m ends the goal before that blowup; it is a quarter of the
      # rover's own length and well inside our tracking accuracy (0.07 m RMS).
      xy_goal_tolerance: 0.4
      # 0.4 -> 0.2 rad (2026-09-17): a 180 deg goal heading stopped 17 deg short --
      # the shim ends the final turn as soon as it enters the tolerance window.
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # In-place pivots are the failure mode on this rover: each one injects up to
      # ~0.9 m of FAKE odom translation (GNSS lever arm, gated in fcu_odom_relay
      # since 2026-09-16) and any residual smears the costmap. So the shim pivots
      # only for a large misalignment and everything else is driven out as an arc;
      # deliberate turn-arounds use the /spin action instead.
      # 0.785 -> 1.2 rad (69 deg): in-place pivots mid-route are what start the
      # smear->replan->pivot runaway, so only pivot for a really large
      # misalignment; smaller errors are driven out as arcs. (2026-09-16)
      angular_dist_threshold: 1.2
      # 2026-09-14 (bag pf_wp_lanechange_3): closed_loop=true rate-limits the
      # rotate command from the MEASURED yaw rate, which is 0 until the tracks
      # break stiction -> cmd stuck at 0 + accel*dt = 0.12 rad/s (< ~0.3 breakaway)
      # -> 14 s stall. false = ramp from the last COMMAND instead.
      closed_loop: false
      # Hysteresis: engage the in-place turn above angular_dist_threshold (69 deg),
      # keep turning down to 17 deg before handing back to RPP (0.785 = none -> chatter).
      angular_disengage_threshold: 0.3
      # Final goal-heading turn via the shim (open-loop ramp) instead of RPP's
      # rotate-to-heading, which has the same measured-rate deadlock.
      rotate_to_goal_heading: true
      # 0.5 -> 2.0 m (2026-09-16): this is where the shim samples the path to decide
      # which way to face. Theta* ignores the rover's heading, so when it detours the
      # path can leave the current pose BACKWARDS for ~1 m before curving to the goal:
      # at 0.5 m the shim read -147 deg and pivoted ~180 deg (bag pf_lane_pivotgate),
      # while the same path read +28 deg at 2 m. Sample at the lookahead distance.
      forward_sampling_distance: 2.0
      # Heavy ~350kg tracked vehicle: needs a strong, fast in-place turn to
      # break track stiction. 0.5/2.0 crawled through ineffective low rates and
      # stalled; 1.5 rad/s (near FCU ATC_STR_RAT_MAX ~2.1) + high accel snaps
      # past stiction. Tuned live on-vehicle 2026-07 then persisted here.
      # (comment above is historical.) 0.45: above the ~0.3 rad/s track-stiction floor.
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      rotate_to_heading_once: false
      # LONG lookahead for a 350 kg tracked rover (validated 2026-09-14, legs A vs C):
      # pure pursuit w = 2*v*e/L^2, so L 0.6 -> 2.0 cuts the correction gain ~11x.
      # At 0.6 m the turn cmd hunted (4 reversals/20 s, 0.55 rad/s spike at the
      # goal); at 2.0 m: 1 reversal, CTE 0.042 m RMS, goal err 0.12 m.
      # 2.0 -> 1.5 m (2026-09-17), safe now that odom is non-holonomic and the shim
      # samples at 2 m. Same 6 m straight + 180 goal both ways: heading max 10.5 ->
      # 7.1 deg, final turn -1.5 -> 0.0 deg, no weave. Lateral RMS unchanged (0.10 m):
      # that residual is a track imbalance (right track needs +43 us PWM to go
      # straight), not controller gain.
      desired_linear_vel: 0.4
      lookahead_dist: 1.5
      min_lookahead_dist: 1.2
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: false
      # Gentler run-in: omega = v * curvature, so a slower, earlier-decelerating
      # approach also shrinks the end-of-goal swing. (2026-09-16)
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 1.2   # match angular_dist_threshold (2026-09-16)
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.6
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Real hull from dagger_description meshes: 1.585 x 1.065 m centred on base_link,
      # padded ~5 cm (self-returns reach x=-0.85). Was robot_radius 0.5 -- a circle that
      # hid the 0.955 m corner radius from Spin/RPP collision checks. (2026-09-14)
      footprint: "[[0.85, 0.58], [0.85, -0.58], [-0.85, -0.58], [-0.85, 0.58]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan scan_band
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 1 s without a scan marks the costmap NOT current, and Humble's
          # controller then waits (controller_server.cpp:402) instead of
          # computing velocity -> the rover stops via the twist_mux /
          # cmd_vel_safety timeouts. Default 0.0 meant "never stale": a dead
          # /scan (p2l wedge P9, or Patchwork++ dying) left Nav2 driving blind.
          expected_update_rate: 1.0
          # /scan uses +inf for "no return within 30 m" (~200 of 723 beams in the
          # open). Nav2's default inf_is_valid=false SKIPS those rays, so open
          # directions never clear stale obstacles (ghosts). (2026-09-17)
          inf_is_valid: true
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
        # The old 0.35-0.75 m band on the raw cloud, kept alongside the
        # ground-segmented /scan so segmentation can only add obstacles. Its
        # publisher always runs; with ground_seg:=false it duplicates /scan.
        scan_band:
          topic: /scan_band
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          expected_update_rate: 1.0
          inf_is_valid: true
          raytrace_max_range: 30.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-09-17: 1.0 m / 3.0 painted walls ~1 m thick in a 3-4 m lane (user: "too much
        # obstacle area"). Steeper decay + 0.8 m keeps the hard no-go zone (inscribed
        # 0.58 m from the footprint) but frees the soft margin. Corner clearance is
        # still enforced by RPP's footprint collision check (use_collision_detection).
        cost_scaling_factor: 6.0
        inflation_radius: 0.8
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.6
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      # Real hull from dagger_description meshes: 1.585 x 1.065 m centred on base_link,
      # padded ~5 cm (self-returns reach x=-0.85). Was robot_radius 0.5 -- a circle that
      # hid the 0.955 m corner radius from Spin/RPP collision checks. (2026-09-14)
      footprint: "[[0.85, 0.58], [0.85, -0.58], [-0.85, -0.58], [-0.85, 0.58]]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan scan_band
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 1 s without a scan marks the costmap NOT current, and Humble's
          # controller then waits (controller_server.cpp:402) instead of
          # computing velocity -> the rover stops via the twist_mux /
          # cmd_vel_safety timeouts. Default 0.0 meant "never stale": a dead
          # /scan (p2l wedge P9, or Patchwork++ dying) left Nav2 driving blind.
          expected_update_rate: 1.0
          # /scan uses +inf for "no return within 30 m" (~200 of 723 beams in the
          # open). Nav2's default inf_is_valid=false SKIPS those rays, so open
          # directions never clear stale obstacles (ghosts). (2026-09-17)
          inf_is_valid: true
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
        # The old 0.35-0.75 m band on the raw cloud, kept alongside the
