bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Non-RTK GNSS-based odom: 0.3 m tolerance thrashed at the goal. (2026-09-14)
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.4
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Drive is now direct RC-override in MANUAL (cmd_vel_to_rc); the vehicle
      # pivots cleanly at ~0.5 rad/s (validated by teleop). The shim owns the
      # in-place turn to the path heading. Tuned to STOP THE HUNT: a MODERATE
      # rotate speed (less momentum) + GENTLE accel (so it can't slam into a
      # reverse when it nears the target) + a wider yaw tolerance. The old
      # 1.0 rad/s + accel 10 was for a GUIDED accel-deadlock that no longer
      # exists on the direct-drive path.
      # High threshold: the shim only does an in-place pivot for LARGE initial
      # misalignments (>45 deg); otherwise RPP handles turns as ARCS while
      # translating. Critical because KISS-ICP position JUMPS during in-place
      # rotation (16-beam scan-match degrades) -> a low threshold re-triggered
      # in-place rotation mid-drive -> odom jumps -> Nav2 hunt/wobble. Pure
      # in-place turn-arounds use the /spin action (gyro yaw, no KISS position).
      # (2026-09-11: reverted from 0.10 which caused the hunt.)
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      # Heavy ~350kg tracked vehicle: needs a strong, fast in-place turn to
      # break track stiction. 0.5/2.0 crawled through ineffective low rates and
      # stalled; 1.5 rad/s (near FCU ATC_STR_RAT_MAX ~2.1) + high accel snaps
      # past stiction. Tuned live on-vehicle 2026-07 then persisted here.
      # (comment above is historical.) 0.45: above the ~0.3 rad/s track-stiction floor.
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      rotate_to_heading_once: false
      # LONG lookahead for a 350 kg tracked rover (validated 2026-09-14, legs A vs C):
      # pure pursuit w = 2*v*e/L^2, so L 0.6 -> 2.0 cuts the correction gain ~11x.
      # At 0.6 m the turn cmd hunted (4 reversals/20 s, 0.55 rad/s spike at the
      # goal); at 2.0 m: 1 reversal, CTE 0.042 m RMS, goal err 0.12 m.
      desired_linear_vel: 0.4
      lookahead_dist: 2.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.6
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.6
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      robot_radius: 0.5
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # Theta* (any-angle): in free space the path IS the straight line to the goal.
    # SmacPlanner2D was replaced 2026-09-14: its 8-connected grid turns a 39.4 deg
    # straight goal into 45 deg diagonals first (0.40 m bulge LEFT of the line);
    # replanned every 1 s from the new pose it always started 45 deg-first, so RPP
    # was pulled into a steady LEFT arc on a straight 6 m goal (bag
    # pf_legA_base_straight_2: carrot +5.6 deg left from t=0 with the rover on the line).
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0
      use_final_approach_orientation: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Heavy ~350kg tracked rover: moderate top speed to limit momentum overshoot,
    # low floor so it can ease into the target (but >stiction breakaway ~0.3),
    # gentle accel. In-place 180 turn-around test (2026-09-11).
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
