; The RTK base station's Blue Pill (STM32F103C8): F9P <-> MAVLink over the RFD868.
; How it talks to the rover: DaggerGCS docs/proposals/base-station.md.
;
;   pio run                      build
;   pio run -t upload            flash with an ST-Link (SWDIO, SWCLK, GND, 3.3 V)
;   pio run -e serial -t upload  or over a USB-serial adapter on PA9/PA10 with BOOT0 = 1
;
; Wiring (3.3 V logic everywhere; power the RFD from 5 V, not from the Blue Pill):
;   F9P  UART1 TX -> PA10 (USART1 RX)     F9P UART1 RX <- PA9 (USART1 TX)
;   RFD868 TX     -> PA3  (USART2 RX)     RFD868 RX    <- PA2 (USART2 TX)
;   GND common to all three. LED: PC13 (on board).

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
; Serial buffers big enough for a second's burst from the F9P (RTCM + UBX, ~1 KB at
; 115200): with the core's 64 bytes, a 194-byte write to the radio (57600) blocked the loop
; and the F9P's bytes overflowed meanwhile -- frames lost (bench, 2026-10-19).
build_flags = -Wall -Wextra -DSERIAL_RX_BUFFER_SIZE=1024 -DSERIAL_TX_BUFFER_SIZE=1024
; ST-Link through OpenOCD's current SWD transport: PlatformIO's own stlink upload asks
; for 'hla_swd', which OpenOCD 0.12 refuses ("doesn't support 'hla_swd' transport").
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd" -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f1x.cfg -c "program {$SOURCE} 0x08000000 verify reset exit"

[env:serial]
extends = env:bluepill
upload_protocol = serial
upload_command =
